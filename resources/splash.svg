<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#121A31"/>
      <stop offset="100%" stop-color="#0A0F1F"/>
    </radialGradient>
    <linearGradient id="blueBall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A9BFF"/>
      <stop offset="100%" stop-color="#2F7BF6"/>
    </linearGradient>
    <linearGradient id="redBall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF7A8C"/>
      <stop offset="100%" stop-color="#FF4D6A"/>
    </linearGradient>
    <linearGradient id="tubeGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>

  <rect width="2732" height="2732" fill="url(#bg)"/>

  <g transform="translate(1366, 1180) scale(1.5) translate(-512, -512)">
    <g transform="translate(180, 220)">
      <rect x="0" y="0" width="280" height="600" rx="140" ry="140"
            fill="url(#tubeGlass)"
            stroke="rgba(140,170,255,0.25)" stroke-width="6"/>
      <circle cx="140" cy="470" r="62" fill="url(#blueBall)"/>
      <circle cx="140" cy="350" r="62" fill="url(#blueBall)"/>
      <circle cx="140" cy="230" r="62" fill="url(#blueBall)"/>
      <circle cx="140" cy="110" r="62" fill="url(#blueBall)"/>
    </g>
    <g transform="translate(564, 220)">
      <rect x="0" y="0" width="280" height="600" rx="140" ry="140"
            fill="url(#tubeGlass)"
            stroke="rgba(255,120,150,0.25)" stroke-width="6"/>
      <circle cx="140" cy="470" r="62" fill="url(#redBall)"/>
      <circle cx="140" cy="350" r="62" fill="url(#redBall)"/>
      <circle cx="140" cy="230" r="62" fill="url(#redBall)"/>
      <circle cx="140" cy="110" r="62" fill="url(#redBall)"/>
    </g>
  </g>
</svg>
