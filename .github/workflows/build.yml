name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Build-only job: it assembles an APK and uploads it as an artifact, and
# never pushes, tags, or publishes. contents: read is all it needs —
# contents: write was a blanket grant that made a compromised build step
# (npm ci runs install scripts) able to push to the repo.
permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        # `npm ci` only, no `|| npm install` fallback. The fallback turned a
        # package.json / package-lock.json mismatch — the one thing a lockfile
        # exists to catch — into a silent non-reproducible resolve, so the APK
        # could be built from a dependency tree nobody ever pinned or tested.
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Add Android platform
        # No `|| true`. Silencing this made a genuine platform-creation
        # failure surface much later as an opaque `cap sync android` error
        # with no Android directory to point at.
        run: |
          npm install @capacitor/android @capacitor/assets
          npx cap add android

      - name: Generate icons and splash
        run: |
          npx @capacitor/assets generate \
            --android \
            --iconBackgroundColor '#0A0F1F' \
            --iconBackgroundColorDark '#0A0F1F' \
            --splashBackgroundColor '#0A0F1F' \
            --splashBackgroundColorDark '#0A0F1F'

      - name: Sync Capacitor
        run: npx cap sync android

      # Adds VIBRATE (for @capacitor/haptics on devices where the OS
      # still gates vibration behind the manifest) and POST_NOTIFICATIONS
      # (Android 13+ — @capacitor/local-notifications cannot post anything
      # without this declared, and the runtime requestPermissions() call
      # in notifications.js silently returns "denied" on 13+ if the
      # manifest doesn't declare it at all). cap add android doesn't
      # generate either, so we inject them here, before the build.
      - name: Patch AndroidManifest permissions
        run: |
          python3 - <<'MANIFEST_EOF'
          import re, sys
          p = "android/app/src/main/AndroidManifest.xml"
          src = open(p).read()
          perms = [
            '<uses-permission android:name="android.permission.VIBRATE" />',
            '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]
          insert = ""
          for perm in perms:
            name = re.search(r'name="([^"]+)"', perm).group(1)
            if name not in src:
              insert += "    " + perm + "\n"
          if insert:
            src = src.replace("<application", insert + "\n    <application", 1)
            open(p, "w").write(src)
            print("Injected:", insert.strip())
          else:
            print("Permissions already present")
          MANIFEST_EOF
          echo "---MANIFEST---"
          grep -E "uses-permission" android/app/src/main/AndroidManifest.xml || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true
          yes | sdkmanager --update || true

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cascade-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
