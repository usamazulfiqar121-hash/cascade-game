name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web
        run: npm run build

      - name: Add Android platform
        run: |
          npm install @capacitor/android @capacitor/assets
          npx cap add android || true

      - name: Generate icons and splash
        run: |
          npx @capacitor/assets generate \
            --android \
            --iconBackgroundColor '#0A0F1F' \
            --iconBackgroundColorDark '#0A0F1F' \
            --splashBackgroundColor '#0A0F1F' \
            --splashBackgroundColorDark '#0A0F1F'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cascade-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
