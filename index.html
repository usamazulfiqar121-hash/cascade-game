<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- type was "image/svg+xml" while href points at favicon.png, which
         is genuinely a PNG (confirmed via file-signature inspection, not
         just the extension) — the declared type just didn't match what
         gets served. Harmless today since there's only one icon
         candidate and browsers generally sniff the real bytes anyway,
         but wrong metadata all the same, and would matter the moment a
         second <link rel="icon"> is ever added for browsers to choose
         between by declared type. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) mean anything.
         Without it every inset resolves to 0 on notched/gesture-bar phones, so
         the safe-area paddings elsewhere in this codebase were all silently
         doing nothing and the top HUD / bottom nav sat under the status bar and
         the gesture bar. Zoom is deliberately left enabled (no maximum-scale,
         no user-scalable=no) — locking pinch-zoom is an accessibility
         regression and buys nothing here. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>cascade-main</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
